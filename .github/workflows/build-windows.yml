name: Build Windows portable app
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Syntax check
        run: python -m compileall -q vault main.py
      - name: Build single-file portable exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PersonalVault --icon assets/icon.ico
          --add-data "assets;assets" --exclude-module tkinter
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalVault-Windows-V1.1
          path: dist/PersonalVault.exe
